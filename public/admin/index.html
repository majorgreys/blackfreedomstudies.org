<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>CBFS Content Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Override Decap admin shell colors */
    [class*="AppHeader"] { background: #1c1917 !important; }
    [class*="AppHeader"] a, [class*="AppHeader"] span { color: #d6d3d1 !important; }
    [class*="AppHeader"] a:hover { color: #fff !important; }
    [class*="ToolbarButton"] { background: #097367 !important; color: #fff !important; border: none !important; }
    [class*="ToolbarButton"]:hover { background: #0a8576 !important; }
    [class*="ToolbarDeleteButton"] { background: #d82125 !important; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // ── Preview styles matching redesign theme ──
    CMS.registerPreviewStyle('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap');
    CMS.registerPreviewStyle(`
      body {
        font-family: 'Archivo', 'Open Sans', sans-serif;
        color: #1c1917;
        line-height: 1.7;
        margin: 0;
        padding: 0;
        background: #fafaf9;
      }
      .preview-header {
        background: #1c1917;
        color: #fff;
        padding: 16px 24px;
        border-left: 4px solid #d82125;
        margin-bottom: 24px;
      }
      .preview-header h1 {
        font-family: 'Archivo', sans-serif;
        font-size: 1.8rem;
        font-weight: 800;
        margin: 0;
        color: #fff;
      }
      .preview-header p {
        margin: 4px 0 0;
        color: #a8a29e;
        font-size: 0.9rem;
      }
      .preview-body {
        padding: 0 24px 24px;
        max-width: 740px;
      }
      .preview-body h2, .preview-body h3 {
        font-family: 'Archivo', sans-serif;
        font-weight: 700;
        color: #1c1917;
      }
      .preview-body a {
        color: #097367;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .preview-body a:hover { color: #0a8576; }
      .preview-meta {
        font-size: 0.82rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #78716c;
        margin-bottom: 12px;
      }
      .preview-speakers {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 16px;
      }
      .preview-speaker-tag {
        background: #097367;
        color: #fff;
        padding: 2px 10px;
        border-radius: 3px;
        font-size: 0.82rem;
        font-weight: 700;
      }
      .preview-books {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 24px;
      }
      .preview-books img {
        height: 180px;
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      }
      .preview-photo {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #097367;
      }
      .preview-speaker-header {
        display: flex;
        gap: 24px;
        align-items: flex-start;
        margin-bottom: 20px;
      }
      .preview-social { font-size: 0.85rem; color: #78716c; margin: 2px 0; }
      .preview-social a { color: #097367; }
      .preview-banner { width: 100%; border-radius: 6px; margin-bottom: 16px; }
      .preview-caption { font-size: 0.8rem; color: #78716c; font-style: italic; margin-top: -12px; margin-bottom: 16px; }
    `, { raw: true });

    // ── Event Preview ──
    var EventPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var title = entry.getIn(['data', 'title']) || '';
        var date = entry.getIn(['data', 'date']) || '';
        var seasonPart = entry.getIn(['data', 'seasonPart']) || '';
        var seasonYear = entry.getIn(['data', 'seasonYear']) || '';
        var speakers = entry.getIn(['data', 'speakers']);
        var books = entry.getIn(['data', 'books']);
        var body = this.props.widgetFor('body');

        var bookImages = [];
        if (books) {
          books.forEach(function(book) {
            var img = this.props.getAsset(book);
            if (img) bookImages.push(img);
          }.bind(this));
        }

        return h('div', {},
          h('div', { className: 'preview-header' },
            h('h1', {}, title),
            h('p', {}, date + ' · ' + seasonPart + ' ' + seasonYear)
          ),
          h('div', { className: 'preview-body' },
            speakers && speakers.size > 0 && h('div', { className: 'preview-speakers' },
              speakers.map(function(s, i) {
                return h('span', { key: i, className: 'preview-speaker-tag' }, s);
              })
            ),
            bookImages.length > 0 && h('div', { className: 'preview-books' },
              bookImages.map(function(img, i) {
                return h('img', { key: i, src: img.toString() });
              })
            ),
            h('div', {}, body)
          )
        );
      }
    });
    CMS.registerPreviewTemplate('events', EventPreview);

    // ── Speaker Preview ──
    var SpeakerPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var name = entry.getIn(['data', 'name']) || '';
        var affiliation = entry.getIn(['data', 'affiliation']) || '';
        var image = entry.getIn(['data', 'image']);
        var twitter = entry.getIn(['data', 'twitter']) || '';
        var social = entry.getIn(['data', 'social']) || '';
        var homepage = entry.getIn(['data', 'homepage']) || '';
        var body = this.props.widgetFor('body');
        var photo = image ? this.props.getAsset(image) : null;

        return h('div', {},
          h('div', { className: 'preview-header' },
            h('h1', {}, name),
            affiliation && h('p', {}, affiliation)
          ),
          h('div', { className: 'preview-body' },
            h('div', { className: 'preview-speaker-header' },
              photo && h('img', { src: photo.toString(), className: 'preview-photo' }),
              h('div', {},
                twitter && h('p', { className: 'preview-social' }, 'X: @' + twitter),
                social && h('p', { className: 'preview-social' }, h('a', { href: social }, social)),
                homepage && h('p', { className: 'preview-social' }, h('a', { href: homepage }, homepage))
              )
            ),
            h('div', {}, body)
          )
        );
      }
    });
    CMS.registerPreviewTemplate('speakers', SpeakerPreview);

    // ── News Preview ──
    var NewsPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var title = entry.getIn(['data', 'title']) || '';
        var date = entry.getIn(['data', 'date']) || '';
        var image = entry.getIn(['data', 'image']);
        var imageCaption = entry.getIn(['data', 'imageCaption']) || '';
        var body = this.props.widgetFor('body');
        var banner = image ? this.props.getAsset(image) : null;

        return h('div', {},
          h('div', { className: 'preview-header' },
            h('p', {}, date),
            h('h1', {}, title)
          ),
          h('div', { className: 'preview-body' },
            banner && h('img', { src: banner.toString(), className: 'preview-banner' }),
            imageCaption && h('p', { className: 'preview-caption' }, imageCaption),
            h('div', {}, body)
          )
        );
      }
    });
    CMS.registerPreviewTemplate('news', NewsPreview);

    // ── Interview Preview ──
    var InterviewPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var title = entry.getIn(['data', 'title']) || '';
        var date = entry.getIn(['data', 'date']) || '';
        var image = entry.getIn(['data', 'image']);
        var relatedEvent = entry.getIn(['data', 'relatedEvent']) || '';
        var body = this.props.widgetFor('body');
        var img = image ? this.props.getAsset(image) : null;

        return h('div', {},
          h('div', { className: 'preview-header' },
            h('p', {}, date),
            h('h1', {}, title)
          ),
          h('div', { className: 'preview-body' },
            relatedEvent && h('p', { className: 'preview-meta' }, 'Related event: ' + relatedEvent),
            img && h('img', { src: img.toString(), className: 'preview-banner' }),
            h('div', {}, body)
          )
        );
      }
    });
    CMS.registerPreviewTemplate('interviews', InterviewPreview);
  </script>
</body>
</html>
