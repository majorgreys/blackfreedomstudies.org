<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>CBFS Content Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    [class*="AppHeader"] { background: #1c1917 !important; }
    [class*="AppHeader"] a, [class*="AppHeader"] span { color: #d6d3d1 !important; }
    [class*="AppHeader"] a:hover { color: #fff !important; }
    [class*="ToolbarButton"] { background: #097367 !important; color: #fff !important; border: none !important; }
    [class*="ToolbarButton"]:hover { background: #0a8576 !important; }
    [class*="ToolbarDeleteButton"] { background: #d82125 !important; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // ── Helpers ──
    function formatDate(d) {
      if (!d) return '';
      var date = new Date(d);
      if (isNaN(date)) return String(d);
      return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }
    function capitalize(s) {
      return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
    }
    function slugToName(slug) {
      if (!slug) return '';
      return slug.split('-').map(function(w) {
        return w.charAt(0).toUpperCase() + w.slice(1);
      }).join(' ');
    }

    // ── Preview styles ──
    CMS.registerPreviewStyle('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap');
    CMS.registerPreviewStyle(`
      * { box-sizing: border-box; }
      body {
        font-family: 'Archivo', 'Open Sans', sans-serif;
        color: #1c1917;
        line-height: 1.7;
        margin: 0;
        padding: 0;
        background: #fafaf9;
      }
      .preview-header {
        background: #1c1917;
        color: #fff;
        padding: 20px 28px;
        border-left: 4px solid #d82125;
        margin-bottom: 0;
      }
      .preview-header h1 {
        font-family: 'Archivo', sans-serif;
        font-size: 1.7rem;
        font-weight: 800;
        margin: 0;
        color: #fff;
        line-height: 1.25;
      }
      .preview-header .subtitle {
        margin: 6px 0 0;
        color: #a8a29e;
        font-size: 0.88rem;
      }
      .preview-accent-bar {
        height: 3px;
        background: linear-gradient(90deg, #d82125 0%, #d82125 30%, #097367 30%, #097367 100%);
        margin-bottom: 24px;
      }
      .preview-body {
        padding: 0 28px 28px;
        max-width: 760px;
      }
      .preview-body h2 { font-size: 1.3rem; font-weight: 700; margin: 24px 0 8px; color: #1c1917; }
      .preview-body h3 { font-size: 1.1rem; font-weight: 700; margin: 20px 0 6px; color: #1c1917; }
      .preview-body p { margin: 0 0 12px; }
      .preview-body a { color: #097367; text-decoration: underline; text-underline-offset: 3px; }
      .preview-body a:hover { color: #0a8576; }

      /* Speaker chips */
      .preview-speakers { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
      .preview-speaker-chip {
        background: #097367; color: #fff;
        padding: 5px 14px; border-radius: 4px;
        font-size: 0.85rem; font-weight: 700;
        letter-spacing: 0.01em;
      }

      /* Book covers */
      .preview-books { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 28px; }
      .preview-books img {
        height: 190px; border-radius: 4px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.18);
        transition: transform 0.15s;
      }

      /* Speaker detail */
      .preview-speaker-layout { display: flex; gap: 28px; align-items: flex-start; margin-bottom: 24px; }
      .preview-photo {
        width: 150px; height: 150px;
        border-radius: 50%; object-fit: cover;
        border: 3px solid #097367;
        flex-shrink: 0;
      }
      .preview-speaker-info { flex: 1; }
      .preview-speaker-info .label {
        font-size: 0.75rem; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.08em;
        color: #78716c; margin: 0 0 2px;
      }
      .preview-speaker-info .value { font-size: 0.9rem; margin: 0 0 10px; }
      .preview-speaker-info .value a { color: #097367; text-decoration: none; }

      /* News banner */
      .preview-banner { width: 100%; border-radius: 8px; margin-bottom: 8px; }
      .preview-caption { font-size: 0.8rem; color: #78716c; font-style: italic; margin: 0 0 20px; }

      /* Section divider */
      .preview-section {
        font-size: 0.75rem; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.1em;
        color: #78716c; margin: 24px 0 10px;
        padding-bottom: 4px; border-bottom: 1px solid #e7e5e4;
      }

      /* Meta badge */
      .preview-badge {
        display: inline-block;
        background: #f5f5f4; border: 1px solid #e7e5e4;
        padding: 2px 10px; border-radius: 3px;
        font-size: 0.78rem; font-weight: 600;
        color: #78716c; margin-right: 6px;
      }
    `, { raw: true });

    // ── Event Preview ──
    var EventPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var title = entry.getIn(['data', 'title']) || '';
        var date = entry.getIn(['data', 'date']) || '';
        var seasonPart = entry.getIn(['data', 'seasonPart']) || '';
        var seasonYear = entry.getIn(['data', 'seasonYear']) || '';
        var speakers = entry.getIn(['data', 'speakers']);
        var books = entry.getIn(['data', 'books']);
        var body = this.props.widgetFor('body');

        var bookImages = [];
        if (books) {
          books.forEach(function(book) {
            var img = this.props.getAsset(book);
            if (img) bookImages.push(img);
          }.bind(this));
        }

        return h('div', {},
          h('div', { className: 'preview-header' },
            h('h1', {}, title),
            h('p', { className: 'subtitle' }, formatDate(date) + '  ·  ' + capitalize(seasonPart) + ' ' + seasonYear)
          ),
          h('div', { className: 'preview-accent-bar' }),
          h('div', { className: 'preview-body' },
            speakers && speakers.size > 0 && [
              h('p', { className: 'preview-section', key: 'speakers-label' }, 'Speakers'),
              h('div', { className: 'preview-speakers', key: 'speakers-list' },
                speakers.map(function(s, i) {
                  return h('span', { key: i, className: 'preview-speaker-chip' }, slugToName(s));
                })
              )
            ],
            bookImages.length > 0 && [
              h('p', { className: 'preview-section', key: 'books-label' }, 'Featured Books'),
              h('div', { className: 'preview-books', key: 'books-list' },
                bookImages.map(function(img, i) {
                  return h('img', { key: i, src: img.toString() });
                })
              )
            ],
            h('div', {}, body)
          )
        );
      }
    });
    CMS.registerPreviewTemplate('events', EventPreview);

    // ── Speaker Preview ──
    var SpeakerPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var name = entry.getIn(['data', 'name']) || '';
        var affiliation = entry.getIn(['data', 'affiliation']) || '';
        var image = entry.getIn(['data', 'image']);
        var twitter = entry.getIn(['data', 'twitter']) || '';
        var social = entry.getIn(['data', 'social']) || '';
        var homepage = entry.getIn(['data', 'homepage']) || '';
        var email = entry.getIn(['data', 'email']) || '';
        var body = this.props.widgetFor('body');
        var photo = image ? this.props.getAsset(image) : null;

        return h('div', {},
          h('div', { className: 'preview-header' },
            h('h1', {}, name),
            affiliation && h('p', { className: 'subtitle' }, affiliation)
          ),
          h('div', { className: 'preview-accent-bar' }),
          h('div', { className: 'preview-body' },
            h('div', { className: 'preview-speaker-layout' },
              photo && h('img', { src: photo.toString(), className: 'preview-photo' }),
              h('div', { className: 'preview-speaker-info' },
                twitter && [
                  h('p', { className: 'label', key: 'tw-l' }, 'Twitter / X'),
                  h('p', { className: 'value', key: 'tw-v' }, h('a', { href: 'https://twitter.com/' + twitter }, '@' + twitter))
                ],
                social && [
                  h('p', { className: 'label', key: 'so-l' }, 'Social'),
                  h('p', { className: 'value', key: 'so-v' }, h('a', { href: social }, social))
                ],
                homepage && [
                  h('p', { className: 'label', key: 'hp-l' }, 'Website'),
                  h('p', { className: 'value', key: 'hp-v' }, h('a', { href: homepage }, homepage))
                ],
                email && [
                  h('p', { className: 'label', key: 'em-l' }, 'Email'),
                  h('p', { className: 'value', key: 'em-v' }, h('a', { href: 'mailto:' + email }, email))
                ]
              )
            ),
            body && [
              h('p', { className: 'preview-section', key: 'bio-label' }, 'Biography'),
              h('div', { key: 'bio-body' }, body)
            ]
          )
        );
      }
    });
    CMS.registerPreviewTemplate('speakers', SpeakerPreview);

    // ── News Preview ──
    var NewsPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var title = entry.getIn(['data', 'title']) || '';
        var date = entry.getIn(['data', 'date']) || '';
        var image = entry.getIn(['data', 'image']);
        var imageCaption = entry.getIn(['data', 'imageCaption']) || '';
        var tags = entry.getIn(['data', 'tags']);
        var body = this.props.widgetFor('body');
        var banner = image ? this.props.getAsset(image) : null;

        return h('div', {},
          h('div', { className: 'preview-header' },
            h('p', { className: 'subtitle' }, formatDate(date)),
            h('h1', {}, title)
          ),
          h('div', { className: 'preview-accent-bar' }),
          h('div', { className: 'preview-body' },
            banner && h('img', { src: banner.toString(), className: 'preview-banner' }),
            imageCaption && h('p', { className: 'preview-caption' }, imageCaption),
            tags && tags.size > 0 && h('div', { style: { marginBottom: '16px' } },
              tags.map(function(t, i) {
                return h('span', { key: i, className: 'preview-badge' }, t);
              })
            ),
            h('div', {}, body)
          )
        );
      }
    });
    CMS.registerPreviewTemplate('news', NewsPreview);

    // ── Interview Preview ──
    var InterviewPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var title = entry.getIn(['data', 'title']) || '';
        var date = entry.getIn(['data', 'date']) || '';
        var image = entry.getIn(['data', 'image']);
        var relatedEvent = entry.getIn(['data', 'relatedEvent']) || '';
        var tags = entry.getIn(['data', 'tags']);
        var body = this.props.widgetFor('body');
        var img = image ? this.props.getAsset(image) : null;

        return h('div', {},
          h('div', { className: 'preview-header' },
            h('p', { className: 'subtitle' }, formatDate(date)),
            h('h1', {}, title)
          ),
          h('div', { className: 'preview-accent-bar' }),
          h('div', { className: 'preview-body' },
            relatedEvent && h('p', { style: { marginBottom: '16px' } },
              h('span', { className: 'preview-badge' }, 'Related: ' + slugToName(relatedEvent))
            ),
            img && h('img', { src: img.toString(), className: 'preview-banner' }),
            tags && tags.size > 0 && h('div', { style: { marginBottom: '16px' } },
              tags.map(function(t, i) {
                return h('span', { key: i, className: 'preview-badge' }, t);
              })
            ),
            h('div', {}, body)
          )
        );
      }
    });
    CMS.registerPreviewTemplate('interviews', InterviewPreview);
  </script>
</body>
</html>
